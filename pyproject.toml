[project]
name = "TellyMeta"
version = "2.0.0"
description = "A personal media management tool"
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "cryptg>=0.6.1",
    "fastapi>=0.162.0",
    "httpx2[socks]>=2.16.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "openai>=3.49.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-socks>=3.2.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "telethon>=1.45.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
sqlite = [
    "aiosqlite>=0.22.1",
]
postgres = [
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.15"
exclude = ["**/__pycache__", "**/.venv", "**/.env", ".git", "**/data", "**/logs"]
typeCheckingMode = "standard"
strictDictionaryInference = true
strictListInference = true
deprecateTypingAliases = true

[tool.ruff]
target-version = "py315"
line-length = 88
exclude = [".venv", ".git", "data", "logs", "alembic"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "SIM",
    "RUF",
    "PTH",
    "PLE",
    "PLW",
    "C4",
    "PIE",
    "A",
    "ISC",
    "RSE",
    "RET",
]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
