<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="watch_time.css?v=20261120">
    <script src="watch_time.js?v=20261121"></script>
    <title>账户管理</title>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #fff);
            --text-color: var(--tg-theme-text-color, #000);
            --hint-color: var(--tg-theme-hint-color, #999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #fff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --destructive-text-color: var(--tg-theme-destructive-text-color, #ff3b30);
            --section-header-text-color: var(--tg-theme-section-header-text-color, #6d6d72);
        }

        body {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            padding: 16px;
            padding-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            color: var(--section-header-text-color);
            text-transform: uppercase;
            margin: 24px 0 8px 16px;
        }

        .section-title:first-child {
            margin-top: 8px;
        }

        .card {
            background-color: var(--bg-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .item {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--secondary-bg-color);
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .item-title {
            font-size: 17px;
            font-weight: 400;
        }

        .item-subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-top: 4px;
            word-break: break-all;
        }

        .item-value {
            font-size: 17px;
            color: var(--hint-color);
        }

        .tag-type {
            font-size: 11px;
            color: var(--text-color);
            background: var(--secondary-bg-color);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: var(--hint-color);
            font-size: 14px;
        }

        .action-item {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            border-bottom: 0.5px solid var(--secondary-bg-color);
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .action-item:last-child {
            border-bottom: none;
        }

        .action-item:active {
            background-color: var(--secondary-bg-color);
        }

        .action-icon {
            font-size: 20px;
            margin-right: 12px;
        }

        .action-text {
            font-size: 17px;
            flex: 1;
        }

        .action-arrow {
            color: var(--hint-color);
            font-size: 14px;
        }

        .action-item.destructive .action-text {
            color: var(--destructive-text-color);
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <div class="section-title">账户信息</div>
            <div class="card" id="account-info">
                <div class="loader">正在加载...</div>
            </div>

            <div id="tos-section" style="display: none;">
                <div class="section-title">用户协议 (TOS)</div>
                <div class="card" style="padding: 12px 16px; font-size: 14px; color: var(--hint-color); white-space: pre-wrap; line-height: 1.5; word-break: break-word;" id="tos-content"></div>
            </div>

            <div class="section-title">操作</div>
            <div class="card" id="actions">
                <div class="action-item" id="btn-renew" onclick="renewAccount()">
                    <span class="action-icon">🔄</span>
                    <span class="action-text">续期</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item" id="btn-redeem-traffic-pack" onclick="redeemTrafficPack()">
                    <span class="action-icon">📦</span>
                    <span class="action-text" id="redeem-traffic-pack-text">积分兑换流量包</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item" onclick="toggleNsfw()">
                    <span class="action-icon">🔞</span>
                    <span class="action-text">切换 NSFW</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item" onclick="resetPassword()">
                    <span class="action-icon">🔑</span>
                    <span class="action-text">重置密码</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item" id="btn-generate-code" onclick="showGenerateCodePopup()">
                    <span class="action-icon">🎫</span>
                    <span class="action-text">生成“码”</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item" id="btn-upload-subtitle" onclick="uploadSubtitle()" style="display:none">
                    <span class="action-icon">📤</span>
                    <span class="action-text">上传字幕</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item" id="btn-request" onclick="goToRequest()" style="display:none">
                    <span class="action-icon">🔍</span>
                    <span class="action-text" id="request-action-text">求片</span>
                    <span class="action-arrow">›</span>
                </div>
                <div class="action-item destructive" onclick="deleteAccount()">
                    <span class="action-icon">🗑️</span>
                    <span class="action-text">注销账户</span>
                    <span class="action-arrow">›</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function applyTheme() {
            // ... (theme logic remains the same)
            const p = tg.themeParams;
            const root = document.documentElement;
            if (p.bg_color) root.style.setProperty('--tg-theme-bg-color', p.bg_color);
            if (p.text_color) root.style.setProperty('--tg-theme-text-color', p.text_color);
            if (p.hint_color) root.style.setProperty('--tg-theme-hint-color', p.hint_color);
            if (p.link_color) root.style.setProperty('--tg-theme-link-color', p.link_color);
            if (p.button_color) root.style.setProperty('--tg-theme-button-color', p.button_color);
            if (p.button_text_color) root.style.setProperty('--tg-theme-button-text-color', p.button_text_color);
            if (p.secondary_bg_color) root.style.setProperty('--tg-theme-secondary-bg-color', p.secondary_bg_color);
        }
        applyTheme();
        tg.onEvent('themeChanged', applyTheme);
        tg.expand();

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            window.location.href = 'miniapp.html';
        });

        const urlParams = new URLSearchParams(window.location.search);
        const serverId = urlParams.get('server_id');

        if (!serverId) {
            document.getElementById('account-info').innerHTML = '<div class="loader" style="color:var(--destructive-text-color)">参数错误</div>';
        }

        let accountData = null;
        let userRenewScore = null;
        let trafficPackConfig = { enabled: true, costScore: 50, sizeGib: 10, packUnitBytes: 10 * 1024 ** 3 };

        /**
         * 拉取当前媒体账号信息并缓存用户续期积分与流量包单价配置，随后触发账号详情视图渲染。
         * 副作用：更新全局 ``accountData``、``userRenewScore``、``trafficPackConfig`` 及页面 DOM 内容。
         */
        async function fetchAccountInfo() {
            try {
                const res = await fetch('/api/miniapp/me', {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "加载失败");
                }

                const data = await res.json();
                userRenewScore = data.renew_score;
                const acc = data.media_accounts.find(item => item.server_id == serverId);

                if (!acc) {
                    throw new Error("账户不存在");
                }

                trafficPackConfig = {
                    enabled: Boolean(acc.traffic_pack_open),
                    costScore: acc.traffic_pack_cost_score ?? 50,
                    sizeGib: acc.traffic_pack_size_gib ?? 10,
                    packUnitBytes: acc.traffic_pack_unit_bytes ?? (10 * 1024 ** 3)
                };

                accountData = acc;
                renderAccountInfo(acc);
            } catch (e) {
                document.getElementById('account-info').innerHTML = `<div class="loader" style="color:var(--destructive-text-color)">${e.message}</div>`;
            }
        }

        /**
         * 渲染媒体账号详情、观看度百分比进度条、流量包余额与自动续期开关区域。
         * @param {object} acc 媒体账号 DTO 对象。
         */
        function renderAccountInfo(acc) {
            const statusColor = resolveAccountStatusColor(acc);
            let expiry = "未知";
            if (acc.expires_at) {
                const d = new Date(acc.expires_at);
                expiry = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
            }

            const autoRenewHint = formatAutoRenewHint(acc, true);
            const quotaText = Number(acc.traffic_quota_bytes || 0) > 0
                ? formatTrafficBytes(acc.traffic_quota_bytes)
                : '不限';
            const remainingText = acc.traffic_remaining_bytes !== null && acc.traffic_remaining_bytes !== undefined
                ? formatTrafficBytes(acc.traffic_remaining_bytes)
                : '不限';
            const totalRemainingText = acc.traffic_total_remaining_bytes !== null && acc.traffic_total_remaining_bytes !== undefined
                ? formatTrafficBytes(acc.traffic_total_remaining_bytes)
                : '不限';
            const resetDateText = formatResetDate(acc.next_reset_at);
            const trafficSummaryText = formatTrafficQuotaSummary(acc);
            const packBytes = Math.max(0, Number(acc.traffic_pack_bytes || 0));

            const watchDegreeRow = renderWatchProgressRow(acc, true);

            const packBalanceRow = (packBytes > 0 || acc.traffic_pack_open)
                ? `
                <div class="item">
                    <div class="item-content">
                        <span class="item-subtitle">当期流量包余额（本周期重置清零）</span>
                        <span class="item-subtitle" style="font-size:12px;">总可用剩余流量: ${totalRemainingText}</span>
                    </div>
                    <span class="item-value" style="font-size:15px">${formatTrafficBytes(packBytes)}</span>
                </div>`
                : '';

            const trafficRows = (acc.enable_traffic || packBytes > 0 || acc.is_traffic_suspended)
                ? `
                <div class="item">
                    <div class="item-content"><span class="item-subtitle">本周期已用流量</span></div>
                    <span class="item-value" style="font-size:15px">${formatTrafficBytes(acc.cycle_traffic_bytes)}</span>
                </div>
                <div class="item">
                    <div class="item-content">
                        <span class="item-subtitle">月基础流量配额 / 剩余</span>
                        <span class="item-subtitle" style="font-size:12px;">${trafficSummaryText}</span>
                    </div>
                    <span class="item-value" style="font-size:14px">${quotaText} / ${remainingText}</span>
                </div>
                ${packBalanceRow}
                <div class="item">
                    <div class="item-content"><span class="item-subtitle">累计总流量</span></div>
                    <span class="item-value" style="font-size:15px">${formatTrafficBytes(acc.total_traffic_bytes)}</span>
                </div>`
                : '';

            const resetRow = (acc.enable_traffic || acc.enable_watch_time)
                ? `
                <div class="item">
                    <div class="item-content"><span class="item-subtitle">下次周期重置</span></div>
                    <span class="item-value" style="font-size:15px">${resetDateText}</span>
                </div>`
                : '';

            const autoRenewRow = (isAutoRenewOpen(acc) || acc.auto_renew)
                ? `
                <div class="item">
                    <div class="item-content">
                        <span class="item-title" style="font-size:15px;">自动续期</span>
                        <span class="item-subtitle" style="font-size:12px;">${autoRenewHint}</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="auto-renew-toggle" ${acc.auto_renew ? 'checked' : ''} onchange="toggleAutoRenew(this)">
                        <span class="slider"></span>
                    </label>
                </div>`
                : '';

            document.getElementById('account-info').innerHTML = `
                <div class="item">
                    <div class="item-content">
                        <span class="item-title">${acc.server_name} <span class="tag-type">${acc.server_type}</span></span>
                        <span class="item-subtitle">${acc.server_url}</span>
                    </div>
                    <span style="font-size:13px; color:${statusColor}">${acc.status_text}</span>
                </div>
                <div class="item">
                    <div class="item-content"><span class="item-subtitle">媒体用户名</span></div>
                    <span class="item-value" style="font-size:15px">${acc.media_name}</span>
                </div>
                <div class="item">
                    <div class="item-content"><span class="item-subtitle">有效期至</span></div>
                    <span class="item-value" style="font-size:15px">${expiry}</span>
                </div>
                ${watchDegreeRow}
                ${trafficRows}
                ${resetRow}
                ${autoRenewRow}
            `;

            const btnRenew = document.getElementById('btn-renew');
            if (btnRenew) {
                btnRenew.style.display = (acc.watch_time_renewal_eligible || acc.can_points_renew) ? 'flex' : 'none';
            }

            const btnRedeemPack = document.getElementById('btn-redeem-traffic-pack');
            const packActionText = document.getElementById('redeem-traffic-pack-text');
            if (btnRedeemPack) {
                btnRedeemPack.style.display = acc.traffic_pack_open ? 'flex' : 'none';
            }
            if (packActionText && acc.traffic_pack_open) {
                packActionText.textContent = `积分兑换流量包（${trafficPackConfig.costScore} 积分 / ${trafficPackConfig.sizeGib} GiB）`;
            }

            const btnGenerateCode = document.getElementById('btn-generate-code');
            if (btnGenerateCode) {
                btnGenerateCode.style.display = acc.can_generate_code ? 'flex' : 'none';
            }

            const btnUpload = document.getElementById('btn-upload-subtitle');
            if (btnUpload) {
                btnUpload.style.display = acc.allow_subtitle_upload ? 'flex' : 'none';
            }

            const btnRequest = document.getElementById('btn-request');
            const requestTextEl = document.getElementById('request-action-text');
            if (btnRequest) {
                btnRequest.style.display = acc.request_open ? 'flex' : 'none';
            }
            if (requestTextEl && acc.request_open) {
                const reqCost = Number(acc.request_points_cost || 0);
                requestTextEl.textContent = reqCost > 0 ? `求片（${reqCost} 积分/次）` : '求片';
            }

            const tosSection = document.getElementById('tos-section');
            const tosContent = document.getElementById('tos-content');
            if (tosSection && tosContent) {
                if (acc.tos) {
                    tosContent.textContent = acc.tos;
                    tosSection.style.display = 'block';
                } else {
                    tosSection.style.display = 'none';
                }
            }
        }

        /**
         * 切换当前媒体账号的自动续期开关并同步本地缓存状态。
         * @param {HTMLInputElement} checkbox 触发切换的复选框元素。
         */
        async function toggleAutoRenew(checkbox) {
            await handleAutoRenewToggle(serverId, tg, checkbox, (finalState) => {
                if (accountData) {
                    accountData.auto_renew = finalState;
                }
            });
        }

        /**
         * 使用积分兑换当前媒体账号的持久化流量包，并在成功后刷新账户详情。
         */
        async function redeemTrafficPack() {
            await handleRedeemTrafficPack(serverId, tg, accountData, trafficPackConfig, () => {
                fetchAccountInfo();
            });
        }

        /**
         * 发起媒体账号手动续期请求；若本周期观看度已达 100%，弹窗明确提示本次免扣积分。
         */
        async function renewAccount() {
            let confirmMsg = "确认要续期当前媒体账号吗？";
            if (accountData && accountData.watch_time_renewal_eligible) {
                confirmMsg = accountData.can_points_renew
                    ? "当前周期观看度已达 100%，本次续期将通过保活免消耗积分，确认续期吗？"
                    : "当前周期观看度已达 100%，本次将通过保活免费续期，确认续期吗？";
            } else if (accountData && accountData.can_points_renew) {
                const costHint = userRenewScore !== null ? `将消耗 ${userRenewScore} 积分` : "将按规则消耗积分";
                confirmMsg = `确认要续期当前媒体账号吗？（${costHint}）`;
            }
            if (!confirm(confirmMsg)) return;

            try {
                tg.MainButton.text = "正在续期...";
                tg.MainButton.show();
                tg.MainButton.showProgress();

                const res = await fetch(`/api/miniapp/accounts/${serverId}/renew`, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });

                const data = await res.json();
                tg.MainButton.hideProgress();
                tg.MainButton.hide();

                if (data.success) {
                    tg.showAlert(data.message);
                    fetchAccountInfo(); // 刷新账户信息
                } else {
                    tg.showAlert(data.detail || data.message || "续期失败");
                }
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
                tg.showAlert(`请求错误: ${e.message}`);
            }
        }

        async function toggleNsfw() {
            if (!confirm("确认要切换当前账户的 NSFW 权限吗？")) return;

            try {
                tg.MainButton.text = "正在处理...";
                tg.MainButton.show();
                tg.MainButton.showProgress();

                const res = await fetch(`/api/miniapp/accounts/${serverId}/toggle_nsfw`, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });

                const data = await res.json();
                tg.MainButton.hideProgress();
                tg.MainButton.hide();

                if (data.success) {
                    tg.showAlert(data.message);
                } else {
                    tg.showAlert(data.detail || data.message || "操作失败");
                }
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
                tg.showAlert(`请求错误: ${e.message}`);
            }
        }

        async function resetPassword() {
            if (!confirm("确认要重置当前账户的密码吗？")) return;

            try {
                tg.MainButton.text = "正在重置密码...";
                tg.MainButton.show();
                tg.MainButton.showProgress();

                const idempotencyKey = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
                const res = await fetch(`/api/miniapp/accounts/${serverId}/reset_password`, {
                    method: 'POST',
                    headers: {
                        'X-Telegram-Init-Data': tg.initData,
                        'X-Idempotency-Key': idempotencyKey
                    }
                });

                const data = await res.json();
                tg.MainButton.hideProgress();
                tg.MainButton.hide();

                if (data.success) {
                    tg.showAlert(data.message);
                } else {
                    tg.showAlert(data.detail || data.message || "重置失败");
                }
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
                tg.showAlert(`请求错误: ${e.message}`);
            }
        }

        function showGenerateCodePopup() {
            tg.showPopup({
                title: '选择邀请码类型',
                message: '请选择您要生成的邀请码类型（将消耗等同续期积分）：',
                buttons: [
                    { id: 'signup', type: 'default', text: '注册码 (Signup)' },
                    { id: 'renew', type: 'default', text: '续期码 (Renew)' },
                    { type: 'cancel' }
                ]
            }, function (btnId) {
                if (btnId) {
                    generateCode(btnId);
                }
            });
        }

        async function generateCode(codeType) {
            try {
                tg.MainButton.text = "正在生成...";
                tg.MainButton.show();
                tg.MainButton.showProgress();

                const url = `/api/miniapp/accounts/${serverId}/generate_code?code_type=${codeType}`;
                const idempotencyKey = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'X-Telegram-Init-Data': tg.initData,
                        'X-Idempotency-Key': idempotencyKey
                    }
                });

                const data = await res.json();
                tg.MainButton.hideProgress();
                tg.MainButton.hide();

                if (data.success) {
                    tg.showAlert(data.message);
                } else {
                    tg.showAlert(data.detail || data.message || "生成失败");
                }
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
                tg.showAlert(`请求错误: ${e.message}`);
            }
        }

        async function uploadSubtitle() {
            if (!confirm("确认要开始上传字幕吗？\n系统将会在 Telegram 私聊窗口发送指引。")) return;

            try {
                tg.MainButton.text = "正在请求...";
                tg.MainButton.show();
                tg.MainButton.showProgress();

                const res = await fetch(`/api/miniapp/tools/${serverId}/upload_subtitle`, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });

                const data = await res.json();
                tg.MainButton.hideProgress();
                tg.MainButton.hide();

                if (data.success) {
                    tg.showAlert(data.message);
                    tg.close();
                } else {
                    tg.showAlert(data.detail || data.message || "请求失败");
                }
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
                tg.showAlert(`请求错误: ${e.message}`);
            }
        }

        function goToRequest() {
            window.location.href = `request.html?server_id=${serverId}`;
        }

        async function deleteAccount() {
            if (!confirm("⚠️ 警告：注销后将彻底删除您在该服务器上的所有播放记录、收藏和账号数据，且操作不可逆！\n\n确认要继续注销吗？")) return;

            try {
                tg.MainButton.text = "正在注销...";
                tg.MainButton.show();
                tg.MainButton.showProgress();

                const res = await fetch(`/api/miniapp/accounts/${serverId}`, {
                    method: 'DELETE',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });

                const data = await res.json();
                tg.MainButton.hideProgress();
                tg.MainButton.hide();

                if (data.success) {
                    tg.showAlert(data.message, () => {
                        window.location.href = 'miniapp.html';
                    });
                } else {
                    tg.showAlert(data.detail || data.message || "注销失败");
                }
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
                tg.showAlert(`请求错误: ${e.message}`);
            }
        }

        fetchAccountInfo();
    </script>
</body>

</html>
