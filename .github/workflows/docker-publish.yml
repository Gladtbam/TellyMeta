name: Docker Build and Push

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.env.example'
      - '.github/**'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.env.example'
      - '.github/**'
      - '.gitignore'
      - '**/*.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: all
            db_extra: all
            suffix: ""
            raw_tag: latest
          - variant: sqlite
            db_extra: sqlite
            suffix: "-sqlite"
            raw_tag: sqlite
          - variant: postgres
            db_extra: postgres
            suffix: "-postgres"
            raw_tag: postgres
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Dockerignore
        run: |
          if [ -f docker/.dockerignore ]; then
            sudo cp docker/.dockerignore .
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule,suffix=${{ matrix.suffix }}
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.raw_tag }},enable={{is_default_branch}}

      - name: Build and push Docker image (${{ matrix.variant }})
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DB_EXTRA=${{ matrix.db_extra }}
          cache-from: type=gha,scope=build-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.variant }}

  cleanup:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write

    steps:
      - name: Delete untagged container package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'tellymeta'
          package-type: container
          min-versions-to-keep: 12
          delete-only-untagged-versions: 'true'

      - name: Cleanup old GitHub Actions caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cache_ids=$(gh cache list --repo "${{ github.repository }}" --limit 100 --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].id')
          for id in $cache_ids; do
            echo "Deleting old cache id: $id"
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done
